<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>JLB Viagens</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header com imagem e logo -->
  <header class="hero-header">
    <img src="images/casal-selfie.jpg" alt="Casal selfie" class="hero-image">
    <div class="hero-overlay">
      <img src="images/jlb-25-anos.png" alt="JLB 25 anos" class="hero-logo">
      <h1>Explore os melhores destinos com a JLB Viagens</h1>
    </div>
  </header>

  <!-- Container dos pacotes -->
  <section class="viagens-section">
    <div id="viagens-container"></div>
  </section>

  <!-- Modal Galeria -->
  <div id="gallery-modal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modal-img">
    <div id="caption"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
